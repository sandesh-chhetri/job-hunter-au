name: Job Hunter Bot

on:
  schedule:
    - cron: '0 */4 * * *' # Runs every 4 hours
  workflow_dispatch:      # Allows you to click "Run Now" manually

jobs:
  scrape_and_notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # REQUIRED: Allows the bot to save history.json

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Job Scraper
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py

      - name: Commit and Push History
        run: |
          git config --global user.name "JobBot"
          git config --global user.email "bot@github.com"
          git add job_history.json
          git commit -m "Update job history [skip ci]" || exit 0
          git push